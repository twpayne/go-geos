name: main
on:
  pull_request:
  push:
    branches:
    - master
    tags:
    - v*
env:
  GOEXPERIMENT: cgocheck2
  GOTOOLCHAIN: local
jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
    - name: install-dependencies
      run: |
        sudo apt-get install -y libgeos-dev
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
      with:
        go-version: stable
    - name: generate
      run: |
        go generate ./...
        git diff --exit-code
    - name: build
      run: go build ./...
    - name: test
      run: go test -race ./...
    - name: test-examples
      run: ( cd examples && go test -race ./... )
  lint:
    runs-on: ubuntu-24.04
    steps:
    - name: install-dependencies
      run: |
        sudo apt-get install -y libgeos-dev
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
      with:
        go-version: stable
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a   # v9.3.0
      with:
        version: v2.12.2
  geos-versions:
    strategy:
      fail-fast: false
      matrix:
        geos-version:
        - 3.12.1 # Used in Ubuntu 24.04 LTS
        - 3.12.3 # Latest 3.12.x
        - 3.13.1 # Latest 3.13.x
        - 3.14.1 # Used in Ubuntu 26.04 LTS
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      id: cache-geos
      with:
        path: ~/work/geos-${{ matrix.geos-version }}
        key: ${{ runner.os }}-geos-${{ matrix.geos-version }}
    - name: build-geos
      if: ${{ steps.cache-geos.outputs.cache-hit != 'true' }}
      run: |
        cd ~/work
        curl https://download.osgeo.org/geos/geos-${{ matrix.geos-version }}.tar.bz2 | tar xjf -
        cd geos-${{ matrix.geos-version }}
        mkdir _build
        cd _build
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
        make -j4
        ctest
    - name: install-geos
      run: |
        cd ~/work/geos-${{ matrix.geos-version }}/_build
        sudo make install
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
      with:
        go-version: stable
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: test
      run: |
        sudo ldconfig
        go test ./...
        ( cd examples && go test ./... )
